appId: com.github.29kiyo.json-translator
productName: json-translator
copyright: Copyright (c) 29kiyo
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
win:
  icon: build/icon.ico
  target:
    - target: portable
      arch: [x64]
    - target: dir
      arch: [x64]
portable:
  artifactName: ${productName}-${version}-portable.exe
