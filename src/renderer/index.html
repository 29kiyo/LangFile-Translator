<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; worker-src 'self' blob:"
    />
    <title>json-translator</title>
  </head>
  <body>
    <div id="app">
      <nav id="tabs">
        <button data-view="editor" data-i18n="nav.editor" class="active"></button>
        <button data-view="providers" data-i18n="nav.providers"></button>
        <button data-view="settings" data-i18n="nav.settings"></button>
      </nav>
      <main>
        <section id="view-editor" class="view active">
          <div id="drop-overlay" data-i18n="editor.dropHere"></div>
          <div id="toolbar">
            <button id="btn-pick" data-i18n="editor.pick"></button>
            <input type="file" id="file-input" multiple hidden />
            <label for="mode-select" data-i18n="editor.mode"></label>
            <select id="mode-select">
              <option value="single" data-i18n="editor.mode.single"></option>
              <option value="multi" data-i18n="editor.mode.multi"></option>
            </select>
            <span id="file-name"></span>
            <span class="spacer"></span>
            <button id="btn-clear" data-i18n="editor.clear"></button>
            <button id="btn-download" data-i18n="editor.download"></button>
          </div>
          <div id="tr-bar">
            <label for="lang-to" class="single-only" data-i18n="tr.to"></label>
            <select id="lang-to" class="single-only">
              <option value="en">English</option>
              <option value="ja">日本語</option>
              <option value="zh-CN">简体中文</option>
              <option value="zh-TW">繁體中文</option>
              <option value="ko">한국어</option>
              <option value="es">Español</option>
              <option value="fr">Français</option>
              <option value="de">Deutsch</option>
              <option value="it">Italiano</option>
              <option value="pt-BR">Português (Brasil)</option>
              <option value="ru">Русский</option>
            </select>
            <label for="tr-mode" data-i18n="tr.mode"></label>
            <select id="tr-mode">
              <option value="structure" data-i18n="tr.mode.structure"></option>
              <option value="keys" data-i18n="tr.mode.keys"></option>
            </select>
            <label for="tr-ignore" data-i18n="tr.ignore"></label>
            <input id="tr-ignore" type="text" placeholder="id,url" />
            <button id="btn-translate" data-i18n="tr.run"></button>
            <button id="btn-cancel" data-i18n="tr.cancel" hidden></button>
            <span id="tr-status"></span>
          </div>
          <div id="split">
            <div id="pane-left" class="pane">
              <div class="pane-title" data-i18n="editor.source"></div>
              <div id="editor-left" class="monaco-host"></div>
            </div>
            <div id="pane-lang" class="pane" hidden>
              <div id="lang-title" class="pane-title"></div>
              <div class="lang-tools">
                <input id="lang-search" type="text" />
                <button id="lang-all" data-i18n="lang.selectShown"></button>
                <button id="lang-none" data-i18n="lang.clearAll"></button>
              </div>
              <ul id="lang-list"></ul>
            </div>
            <div id="pane-right" class="pane">
              <div id="title-right" class="pane-title" data-i18n="editor.output"></div>
              <div id="editor-right" class="monaco-host"></div>
              <div id="list-title" class="pane-title" hidden></div>
              <ul id="file-list" hidden></ul>
            </div>
          </div>
        </section>
        <section id="view-providers" class="view">
          <div class="row">
            <button id="btn-provider-add" data-i18n="providers.add"></button>
            <span class="hint" data-i18n="providers.hint"></span>
          </div>
          <div class="row">
            <input type="checkbox" class="switch" id="dist-enabled" />
            <label for="dist-enabled" data-i18n="providers.distribution"></label>
          </div>
          <ul id="provider-list"></ul>
          <div id="provider-form" hidden>
            <div class="row">
              <label for="pf-type" data-i18n="providers.type"></label>
              <select id="pf-type"></select>
            </div>
            <div class="row">
              <label for="pf-name" data-i18n="providers.name"></label>
              <input id="pf-name" type="text" />
            </div>
            <div class="row" id="pf-mode-row" hidden>
              <label for="pf-mode" data-i18n="providers.mode"></label>
              <select id="pf-mode">
                <option value="api" data-i18n="providers.mode.api"></option>
                <option value="local" data-i18n="providers.mode.local"></option>
              </select>
            </div>
            <div class="row">
              <label for="pf-url" data-i18n="providers.url"></label>
              <input id="pf-url" type="text" />
            </div>
            <div class="row" id="pf-key-row">
              <label for="pf-key" data-i18n="providers.apiKey"></label>
              <input id="pf-key" type="password" autocomplete="off" />
            </div>
            <div class="row" id="pf-model-row">
              <label for="pf-model" data-i18n="providers.model"></label>
              <input id="pf-model" type="text" list="pf-models" />
              <datalist id="pf-models"></datalist>
            </div>
            <div class="row">
              <label for="pf-priority" data-i18n="providers.priority"></label>
              <input id="pf-priority" type="number" min="1" />
            </div>
            <div class="row">
              <input type="checkbox" class="switch" id="pf-enabled" />
              <label for="pf-enabled" data-i18n="providers.enabled"></label>
            </div>
            <div class="row">
              <button id="pf-test" data-i18n="providers.test"></button>
              <button id="pf-save" data-i18n="providers.save"></button>
              <button id="pf-cancel" data-i18n="providers.cancel"></button>
            </div>
            <pre id="pf-result"></pre>
          </div>
        </section>
        <section id="view-settings" class="view">
          <div class="row">
            <label for="set-theme" data-i18n="settings.theme"></label>
            <select id="set-theme">
              <option value="dark" data-i18n="settings.theme.dark"></option>
              <option value="light" data-i18n="settings.theme.light"></option>
            </select>
          </div>
          <div class="row">
            <label for="set-lang" data-i18n="settings.language"></label>
            <select id="set-lang">
              <option value="auto" data-i18n="settings.lang.auto"></option>
              <option value="en">English</option>
              <option value="ja">日本語</option>
            </select>
          </div>
          <div class="row">
            <input type="checkbox" class="switch" id="set-log" />
            <label for="set-log" data-i18n="settings.showLog"></label>
          </div>
          <div class="row">
            <label for="set-namestyle" data-i18n="settings.nameStyle"></label>
            <select id="set-namestyle">
              <option value="full">ja_jp.json</option>
              <option value="short">ja.json</option>
            </select>
          </div>
          <div class="row">
            <label for="set-bulk" data-i18n="settings.bulkMethod"></label>
            <select id="set-bulk">
              <option value="zip">ZIP</option>
              <option value="folder" data-i18n="settings.bulk.folder"></option>
            </select>
          </div>
          <div class="row">
            <label data-i18n="settings.outputDir"></label>
            <code id="out-dir"></code>
            <button id="btn-outdir" data-i18n="settings.chooseDir"></button>
            <button id="btn-outdir-reset" data-i18n="settings.resetDir"></button>
          </div>
        </section>
      </main>
      <pre id="log"></pre>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
